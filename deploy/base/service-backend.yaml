apiVersion: v1
kind: Service
metadata:
  name: interactive-labs-console-plugin
  namespace: interactive-labs-console-plugin
  annotations:
    # Cluster injects a signed TLS cert into the named secret.
    service.beta.openshift.io/serving-cert-secret-name: interactive-labs-console-plugin-tls
spec:
  selector:
    app: interactive-labs-backend
  ports:
    - name: https
      port: 9001
      targetPort: 9001
      protocol: TCP
