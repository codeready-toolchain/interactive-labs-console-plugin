apiVersion: apps/v1
kind: Deployment
metadata:
  name: interactive-labs
  namespace: interactive-labs-console-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interactive-labs-backend
  template:
    metadata:
      labels:
        app: interactive-labs-backend
    spec:
      serviceAccountName: interactive-labs-backend
      containers:
        - name: backend
          image: interactive-labs-console-plugin:latest
          ports:
            - containerPort: 9001
              name: backend-https
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Invalid values are logged and use defaults.
            - name: CACHE_REFRESH_INTERVAL
              value: 1h
            - name: CACHE_CONCURRENT_REFRESH_LIMIT
              value: "4"
          volumeMounts:
            - name: backend-tls
              mountPath: /etc/tls/backend
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: backend-tls
          secret:
            secretName: interactive-labs-console-plugin-tls
