apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: interactive-labs-console-plugin
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - service-backend.yaml
  - deployment-backend.yaml
  - console-plugin.yaml
  - catalog.yaml
images:
  - name: interactive-labs-console-plugin
    newName: image-registry.openshift-image-registry.svc:5000/interactive-labs-console-plugin/interactive-labs-console-plugin
    newTag: latest
