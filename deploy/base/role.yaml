apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: interactive-labs-catalog-reader
  namespace: interactive-labs-console-plugin
rules:
  - apiGroups:
    - ""
    resources:
      - configmaps
    resourceNames:
      - interactive-labs-catalog
    verbs:
      - get
      - list
      - watch
  - apiGroups:
    - ""
    resources:
      - events
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: interactive-labs-catalog-reader
  namespace: interactive-labs-console-plugin
subjects:
  - kind: ServiceAccount
    name: interactive-labs-backend
    namespace: interactive-labs-console-plugin
roleRef:
  kind: Role
  name: interactive-labs-catalog-reader
  apiGroup: rbac.authorization.k8s.io